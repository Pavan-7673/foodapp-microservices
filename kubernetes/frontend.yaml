apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: foodapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: pavanreddy8/foodapp-frontend:v1
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "150m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: foodapp
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
