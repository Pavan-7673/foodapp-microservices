apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: foodapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
      - name: restaurant-service
        image: pavanreddy8/foodapp-restaurant-service:v1
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "restaurant-mysql"
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-user }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-password }
        - name: DB_NAME
          value: "restaurantdb"
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: foodapp
spec:
  selector:
    app: restaurant-service
  ports:
  - port: 5000
    targetPort: 5000
