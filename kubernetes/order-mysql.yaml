apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mysql
  namespace: foodapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-mysql
  template:
    metadata:
      labels:
        app: order-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-root-password }
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-user }
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-password }
        - name: MYSQL_DATABASE
          value: orderdb
        volumeMounts:
        - name: storage
          mountPath: /var/lib/mysql
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { cpu: "500m", memory: "512Mi" }
      volumes:
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-mysql
  namespace: foodapp
spec:
  selector:
    app: order-mysql
  ports:
  - port: 3306
    targetPort: 3306
