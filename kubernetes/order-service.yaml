apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: pavanreddy8/foodapp-order-service:v1
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "order-mysql"
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-user }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: foodapp-secret, key: mysql-password }
        - name: DB_NAME
          value: "orderdb"
        - name: USER_SERVICE_URL
          value: "http://user-service:5000"
        - name: RESTAURANT_SERVICE_URL
          value: "http://restaurant-service:5000"
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foodapp
spec:
  selector:
    app: order-service
  ports:
  - port: 5000
    targetPort: 5000
