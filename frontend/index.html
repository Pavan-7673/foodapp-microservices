<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodExpress — Order Food Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, sans-serif; background:#f5f5f5; color:#333; }
  .header { background:#fc8019; color:#fff; padding:18px 24px; }
  .header h1 { font-size:22px; }
  .container { max-width:900px; margin:24px auto; padding:0 20px; }
  .section { background:#fff; border-radius:10px; padding:20px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .section h2 { font-size:16px; margin-bottom:14px; }
  .restaurant-card { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid #eee; border-radius:8px; margin-bottom:10px; cursor:pointer; }
  .restaurant-card:hover { border-color:#fc8019; }
  .restaurant-card.active { border-color:#fc8019; background:#fff7f0; }
  .rname { font-weight:bold; font-size:15px; }
  .rmeta { font-size:12px; color:#888; }
  .menu-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f0f0; }
  .menu-item:last-child { border-bottom:none; }
  .price { font-weight:bold; color:#333; }
  .btn { padding:6px 16px; background:#fc8019; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; }
  .btn:hover { background:#e0701a; }
  .order-summary { background:#fff7f0; border-radius:8px; padding:14px; font-size:14px; margin-top:14px; display:none; }
  .form-group { margin-bottom:10px; }
  .form-group input { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
  .toast { position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 20px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>
<body>

<div class="header"><h1>🍔 FoodExpress</h1></div>

<div class="container">

  <div class="section">
    <h2>👤 Step 1 — Your Details</h2>
    <div class="form-group"><input id="name" placeholder="Full name"></div>
    <div class="form-group"><input id="email" placeholder="Email"></div>
    <div class="form-group"><input id="address" placeholder="Delivery address"></div>
    <button class="btn" onclick="createUser()">Save Details</button>
    <span id="user-status" style="margin-left:10px; font-size:13px; color:#2e7d32;"></span>
  </div>

  <div class="section">
    <h2>🍽 Step 2 — Choose a Restaurant</h2>
    <div id="restaurants">Loading restaurants...</div>
  </div>

  <div class="section" id="menu-section" style="display:none;">
    <h2>📋 Step 3 — Menu</h2>
    <div id="menu"></div>
  </div>

  <div class="order-summary" id="order-summary"></div>

</div>

<div class="toast" id="toast"></div>

<script>
let currentUserId = null;
let currentRestaurantId = null;

async function createUser() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();
  if (!name || !email) { showToast('Enter name and email'); return; }

  const res = await fetch('/api/users', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, email, address})
  });
  const data = await res.json();
  if (res.ok) {
    currentUserId = data.id;
    document.getElementById('user-status').textContent = `✓ Saved (User ID: ${data.id})`;
    showToast('Details saved!');
  } else {
    showToast(data.error || 'Error saving details');
  }
}

async function loadRestaurants() {
  const res = await fetch('/api/restaurants');
  const restaurants = await res.json();
  document.getElementById('restaurants').innerHTML = restaurants.map(r => `
    <div class="restaurant-card" onclick="selectRestaurant(${r.id}, this)">
      <div>
        <div class="rname">${r.name}</div>
        <div class="rmeta">${r.cuisine} · ⭐ ${r.rating}</div>
      </div>
      <button class="btn">View Menu</button>
    </div>
  `).join('');
}

async function selectRestaurant(id, el) {
  currentRestaurantId = id;
  document.querySelectorAll('.restaurant-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');

  const res = await fetch(`/api/restaurants/${id}/menu`);
  const items = await res.json();
  document.getElementById('menu-section').style.display = 'block';
  document.getElementById('menu').innerHTML = items.map(item => `
    <div class="menu-item">
      <div>${item.name}</div>
      <div class="price">₹${item.price} <button class="btn" style="margin-left:10px;" onclick="placeOrder(${item.id}, '${item.name}', ${item.price})">Order</button></div>
    </div>
  `).join('');
}

async function placeOrder(menuItemId, itemName, price) {
  if (!currentUserId) { showToast('Please save your details first (Step 1)'); return; }

  const res = await fetch('/api/orders', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user_id: currentUserId,
      restaurant_id: currentRestaurantId,
      menu_item_id: menuItemId,
      quantity: 1
    })
  });
  const data = await res.json();
  if (res.ok) {
    document.getElementById('order-summary').style.display = 'block';
    document.getElementById('order-summary').innerHTML =
      `✅ Order #${data.order_id} placed — ${itemName} — Total: ₹${data.total_price}`;
    showToast('Order placed successfully!');
  } else {
    showToast(data.error || 'Order failed');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

loadRestaurants();
</script>
</body>
</html>
